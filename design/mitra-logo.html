<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mitra logo</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #f0f0f0;
  }
  .mitra-caption {
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: #7C8798;
  }
</style>
</head>
<body>

<div style="width: 960px; height: 680px; box-sizing: border-box; padding: 80px; background: #FAFAFA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px;">

  <!-- Section 1: App icon tile + standalone mark -->
  <div style="display: flex; flex-direction: row; align-items: flex-start; justify-content: center; gap: 72px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="width: 176px; height: 176px; border-radius: 39px; background: #4361EE; display: flex; align-items: center; justify-content: center;">
        <svg width="110" height="110" viewBox="0 -8 100 108" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14,84 L14,38 C14,12 42,12 42,38 L50,84 L58,38 C58,12 86,12 86,38 L86,84" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="28" cy="3.5" r="9" fill="#FFFFFF"/>
          <circle cx="72" cy="3.5" r="9" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="mitra-caption">App Icon</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="width: 176px; height: 176px; display: flex; align-items: center; justify-content: center;">
        <svg width="140" height="140" viewBox="0 -8 100 108" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14,84 L14,38 C14,12 42,12 42,38 L50,84 L58,38 C58,12 86,12 86,38 L86,84" stroke="#4361EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="28" cy="3.5" r="9" fill="#4361EE"/>
          <circle cx="72" cy="3.5" r="9" fill="#4361EE"/>
        </svg>
      </div>
      <div class="mitra-caption">Mark</div>
    </div>

  </div>

  <!-- Section 2: scalability check -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="display: flex; flex-direction: row; align-items: center; gap: 20px;">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: #4361EE; display: flex; align-items: center; justify-content: center;">
        <svg width="35" height="35" viewBox="0 -8 100 108" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14,84 L14,38 C14,12 42,12 42,38 L50,84 L58,38 C58,12 86,12 86,38 L86,84" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="28" cy="3.5" r="9" fill="#FFFFFF"/>
          <circle cx="72" cy="3.5" r="9" fill="#FFFFFF"/>
        </svg>
      </div>
      <div style="width: 40px; height: 40px; border-radius: 9px; background: #4361EE; display: flex; align-items: center; justify-content: center;">
        <svg width="25" height="25" viewBox="0 -8 100 108" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14,84 L14,38 C14,12 42,12 42,38 L50,84 L58,38 C58,12 86,12 86,38 L86,84" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="28" cy="3.5" r="9" fill="#FFFFFF"/>
          <circle cx="72" cy="3.5" r="9" fill="#FFFFFF"/>
        </svg>
      </div>
      <div style="width: 28px; height: 28px; border-radius: 6px; background: #4361EE; display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 -8 100 108" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14,84 L14,38 C14,12 42,12 42,38 L50,84 L58,38 C58,12 86,12 86,38 L86,84" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="28" cy="3.5" r="9" fill="#FFFFFF"/>
          <circle cx="72" cy="3.5" r="9" fill="#FFFFFF"/>
        </svg>
      </div>
    </div>
    <div class="mitra-caption">Scales cleanly at small sizes</div>
  </div>

  <!-- Section 3: wordmark lockup -->
  <div style="display: flex; flex-direction: row; align-items: center; gap: 18px;">
    <svg width="64" height="64" viewBox="0 -8 100 108" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M14,84 L14,38 C14,12 42,12 42,38 L50,84 L58,38 C58,12 86,12 86,38 L86,84" stroke="#4361EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28" cy="3.5" r="9" fill="#4361EE"/>
      <circle cx="72" cy="3.5" r="9" fill="#4361EE"/>
    </svg>
    <span style="font-family: 'Manrope', system-ui, sans-serif; font-size: 48px; font-weight: 800; letter-spacing: -0.5px; color: #101828; line-height: 1;">Mitra</span>
  </div>

</div>
</body>
</html>
